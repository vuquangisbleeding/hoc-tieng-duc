<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sprechen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Luyện phát âm tiếng Đức</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
  --bg:light-dark(#f4f1ea,#14161c);--card:light-dark(#fff,#1e2129);--ink:light-dark(#16181d,#f1efe9);
  --muted:light-dark(#6a6f7a,#9aa0ab);--line:light-dark(#e2ddd2,#2d313b);
  --gold:#f2b705;--red:#d62f2f;--green:#1f9d55;--orange:#e07b00;
  --der:#2563eb;--die:#d62f2f;--das:#1f9d55}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,sans-serif;overflow-x:clip;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 48px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header h1{font-size:20px;margin:0;flex:1}
.flag{width:22px;height:16px;border-radius:3px;background:linear-gradient(#111 0 33%,var(--red) 33% 66%,var(--gold) 66%)}
button{font:inherit;color:inherit;cursor:pointer}
.chip,.ibtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px}
.ibtn{border-radius:12px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chips .chip{flex:none;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px}
.nav{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}
.word{text-align:center;margin:18px 0 4px}
.art{font-weight:800;font-size:18px}
.de{font-size:clamp(34px,10vw,52px);font-weight:800;line-height:1.08;letter-spacing:-.01em;overflow-wrap:anywhere}
.de .ok{color:var(--green)}.de .bad{color:var(--red);text-decoration:underline wavy;text-underline-offset:6px}
.vi{text-align:center;color:var(--muted);margin:10px 0 12px}
.tip{background:light-dark(#fff7dc,#2a2513);border-radius:14px;padding:12px 14px;font-size:15px}
.tip b{color:light-dark(#8a6400,var(--gold))}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.mic{display:block;margin:20px auto 6px;width:96px;height:96px;border-radius:50%;border:0;background:var(--red);color:#fff;
  box-shadow:0 8px 24px rgba(214,47,47,.35);display:grid;place-items:center}
.mic svg{width:40px;height:40px}
.mic.on{animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,47,47,.55)}100%{box-shadow:0 0 0 22px rgba(214,47,47,0)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none;outline:4px solid var(--gold)}}
.status{text-align:center;color:var(--muted);min-height:24px;font-size:15px}
.err{color:var(--red);text-align:center;font-size:14px;margin-top:6px}
.verdict{font-size:24px;font-weight:800;text-align:center}
.heard{text-align:center;margin:6px 0 12px;color:var(--muted)}
.heard b{color:var(--ink)}
.meter{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;border-radius:99px}
.scores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.sc{background:var(--bg);border-radius:12px;padding:8px 4px;text-align:center}
.sc b{display:block;font-size:20px}.sc span{font-size:12px;color:var(--muted)}
.wd{border-top:1px solid var(--line);padding:10px 0}
.wd .w{font-weight:800;font-size:18px}
.ph{display:inline-block;margin:4px 4px 0 0;padding:3px 8px;border-radius:8px;font-size:14px;color:#fff}
.g{background:var(--green)}.o{background:var(--orange)}.r{background:var(--red)}
.alts{font-size:13px;color:var(--muted);text-align:center}
.hidden{display:none!important}
input{font:inherit;font-size:16px;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.prim{background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:12px 18px;font-weight:600;min-height:44px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.li{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;text-align:left}
.li small{display:block;color:var(--muted)}
.dot{float:right;width:10px;height:10px;border-radius:50%;background:var(--line);margin-top:6px}
.small{font-size:13px;color:var(--muted)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="flag" aria-hidden="true"></span>
    <h1>Luyện phát âm</h1>
    <button class="ibtn" id="btnList" aria-label="Danh sách từ">☰ Từ</button>
    <button class="ibtn" id="btnSet" aria-label="Cài đặt">⚙</button>
  </header>

  <div class="chips" id="cats"></div>

  <section class="card hidden" id="setPanel">
    <b>Cài đặt</b>
    <label for="rate">Tốc độ giọng mẫu</label>
    <input id="rate" type="range" min="0.5" max="1.1" step="0.1" value="0.85">
    <label for="level">Độ khó khi chấm (chế độ miễn phí)</label>
    <select id="level" style="font:inherit;font-size:16px;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">
      <option value="0.7">Dễ – máy chắc chắn ≥ 70%</option>
      <option value="0.85">Vừa – ≥ 85%</option>
      <option value="0.9">Khó – ≥ 90% và máy không phân vân</option>
    </select>
    <p class="small">Mặc định app dùng nhận diện giọng nói có sẵn của điện thoại (miễn phí). Nếu nhập khóa Azure Speech, app sẽ chấm chi tiết đến từng âm.</p>
    <label for="azKey">Khóa Azure Speech (không bắt buộc)</label>
    <input id="azKey" type="password" autocomplete="off" placeholder="Để trống = dùng chế độ miễn phí">
    <label for="azReg">Vùng Azure</label>
    <input id="azReg" type="text" autocomplete="off" placeholder="vd: westeurope">
    <div class="row"><button class="prim" id="saveSet">Lưu</button><button class="ibtn" id="resetProg">Xoá tiến độ</button></div>
    <p class="small" id="modeInfo"></p>
  </section>

  <section class="card hidden" id="listPanel">
    <b>Chọn từ</b>
    <div class="list" id="list" style="margin-top:10px"></div>
  </section>

  <section class="card" id="practice">
    <div class="nav">
      <button class="ibtn" id="prev" aria-label="Từ trước">‹</button>
      <span id="counter"></span>
      <button class="ibtn" id="next" aria-label="Từ sau">›</button>
    </div>
    <div class="word"><div class="art" id="art"></div><div class="de" id="de"></div></div>
    <div class="vi" id="vi"></div>
    <div class="tip" id="tip"></div>
    <div class="row">
      <button class="ibtn" id="listen">🔊 Nghe mẫu</button>
      <button class="ibtn" id="listenSlow">🐢 Nghe chậm</button>
    </div>
    <button class="mic" id="mic" aria-label="Bấm để nói">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
    </button>
    <div class="status" id="status">Bấm mic rồi đọc từ trên</div>
    <div class="err" id="err"></div>
  </section>

  <section class="card hidden" id="result">
    <div class="verdict" id="verdict"></div>
    <div class="heard" id="heard"></div>
    <div class="meter"><i id="bar"></i></div>
    <div class="scores hidden" id="scores"></div>
    <div id="detail"></div>
    <div class="alts" id="alts"></div>
    <div class="row"><button class="ibtn" id="again">↻ Đọc lại</button><button class="prim" id="goNext">Từ tiếp →</button></div>
  </section>

  <section class="card">
    <b>Tự nhập từ hoặc câu</b>
    <div class="row"><input id="custom" placeholder="vd: Ich möchte ein Brötchen"></div>
    <div class="row"><button class="ibtn" id="useCustom">Luyện câu này</button></div>
  </section>
  <p class="small" style="text-align:center">Tiến độ chỉ lưu trên máy này.</p>
</div>

<script>
{
const WORDS=[
 {c:"ö ü ä",a:"das",w:"Brötchen",m:"bánh mì nhỏ",t:"<b>ö</b>: lưỡi đặt như “ê”, môi tròn như “ô”. <b>ch</b> sau ö là tiếng xì nhẹ, không phải “k”."},
 {c:"ö ü ä",a:"die",w:"Küche",m:"nhà bếp",t:"<b>ü</b>: lưỡi như “i”, môi chu tròn như “u”. Đừng nhầm với <i>Kuchen</i>."},
 {c:"ö ü ä",a:"",w:"schön",m:"đẹp",t:"<b>sch</b> như “s” uốn lưỡi, môi hơi chu. <b>ö</b> dài."},
 {c:"ö ü ä",a:"",w:"müde",m:"mệt",t:"<b>ü</b> dài; <b>d</b> rõ, <b>-e</b> cuối đọc nhẹ “ơ”."},
 {c:"ö ü ä",a:"das",w:"Mädchen",m:"cô gái",t:"<b>ä</b> gần “e” mở. <b>-chen</b> đọc nhẹ, ch xì."},
 {c:"ö ü ä",a:"",w:"fünf",m:"số năm",t:"<b>ü</b> ngắn, môi tròn. Kết thúc bằng <b>nf</b>: răng trên chạm môi dưới."},
 {c:"ch",a:"",w:"ich",m:"tôi",t:"<b>ch</b> sau i/e: lưỡi gần vòm, thổi hơi xì như mèo phì. Không đọc “ích”."},
 {c:"ch",a:"der",w:"Kuchen",m:"bánh ngọt",t:"<b>ch</b> sau a/o/u: khàn ở cổ, giống “kh” tiếng Việt."},
 {c:"ch",a:"",w:"acht",m:"số tám",t:"<b>ch</b> khàn như “kh”, rồi bật <b>t</b> rõ."},
 {c:"ch",a:"",w:"Milch",m:"sữa",t:"Sau <b>l</b>, <b>ch</b> là âm xì nhẹ."},
 {c:"r",a:"",w:"rot",m:"màu đỏ",t:"<b>r</b> đầu từ: rung nhẹ ở cuống họng (như súc miệng), không rung đầu lưỡi."},
 {c:"r",a:"der",w:"Vater",m:"bố",t:"<b>-er</b> cuối từ đọc thành “ơ” (gần “a” nhẹ), không cần r. <b>V</b> = “ph”."},
 {c:"r",a:"",w:"Frühstück",m:"bữa sáng",t:"<b>Fr</b>: r họng ngay sau f. <b>st</b> đầu âm tiết = “sch-t”."},
 {c:"ei ie eu",a:"",w:"Bier",m:"bia",t:"<b>ie</b> = “i” dài."},
 {c:"ei ie eu",a:"",w:"Wein",m:"rượu vang",t:"<b>ei</b> = “ai”. <b>W</b> = “v”."},
 {c:"ei ie eu",a:"",w:"heute",m:"hôm nay",t:"<b>eu</b> = “oi”. <b>h</b> bật hơi."},
 {c:"ei ie eu",a:"das",w:"Haus",m:"ngôi nhà",t:"<b>au</b> = “ao”. <b>s</b> cuối không rung."},
 {c:"z sch sp",a:"",w:"zehn",m:"số mười",t:"<b>z</b> = “ts”. <b>eh</b> = “ê” dài."},
 {c:"z sch sp",a:"die",w:"Zeit",m:"thời gian",t:"<b>Z</b> = “ts”, <b>ei</b> = “ai”: “tsai-t”."},
 {c:"z sch sp",a:"",w:"sprechen",m:"nói",t:"<b>sp</b> đầu từ = “schp”. <b>ch</b> sau e xì nhẹ."},
 {c:"z sch sp",a:"die",w:"Straße",m:"con đường",t:"<b>st</b> = “scht”, <b>ß</b> = “s” mạnh, <b>a</b> dài."},
 {c:"z sch sp",a:"",w:"Entschuldigung",m:"xin lỗi",t:"<b>tsch</b> như “ch” bật mạnh. Trọng âm ở <b>schul</b>."},
 {c:"Câu",a:"",w:"Guten Morgen",m:"chào buổi sáng",t:"<b>-en</b> đọc lướt. <b>r</b> trong Morgen rất nhẹ."},
 {c:"Câu",a:"",w:"Wie geht es dir",m:"bạn khoẻ không",t:"<b>W</b> = “v”, <b>ie</b> = “i” dài, <b>g</b> luôn cứng."},
 {c:"Câu",a:"",w:"Ich möchte ein Brötchen",m:"tôi muốn một ổ bánh mì",t:"Hai âm <b>ö</b> và hai âm <b>ch</b> xì — câu luyện tổng hợp."},
 {c:"Câu",a:"",w:"Ich komme aus Vietnam",m:"tôi đến từ Việt Nam",t:"<b>V</b> trong Vietnam đọc “v” (từ mượn). <b>aus</b> = “ao-s”."}
];
const CATS=["Tất cả",...new Set(WORDS.map(x=>x.c))];
const $=id=>document.getElementById(id);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let prog=store.get("deProg",{}), cfg=store.get("deCfg",{rate:.85,key:"",reg:""});
let cat="Tất cả", list=WORDS, idx=0, custom=null, busy=false;

const cur=()=>custom||list[idx];
const full=x=>(x.a?x.a+" ":"")+x.w;
const norm=s=>s.toLowerCase().normalize("NFC").replace(/ß/g,"ss").replace(/[.,!?;:"'„“”()-]/g," ").replace(/\s+/g," ").trim();

function renderCats(){
  $("cats").innerHTML=CATS.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("");
}
function renderWord(){
  const x=cur();
  $("art").textContent=x.a||""; $("art").style.color=x.a?`var(--${x.a})`:"";
  $("de").textContent=x.w; $("vi").textContent=x.m||"";
  $("tip").innerHTML=x.t||"Đọc rõ từng âm, chậm trước rồi nhanh dần.";
  $("tip").classList.toggle("hidden",!x.t&&custom);
  $("counter").textContent=custom?"Câu tự nhập":`${idx+1} / ${list.length}${prog[x.w]?" · tốt nhất "+prog[x.w]+"%":""}`;
  $("result").classList.add("hidden"); $("err").textContent=""; $("status").textContent="Bấm mic rồi đọc "+(x.w.includes(" ")?"câu":"từ")+" trên";
}
function renderList(){
  $("list").innerHTML=WORDS.map((x,i)=>{const p=prog[x.w];const col=p==null?"":p>=85?"var(--green)":p>=60?"var(--orange)":"var(--red)";
    return `<button class="li" data-i="${i}"><span class="dot" style="${col?"background:"+col:""}"></span>${x.w}<small>${x.m}</small></button>`}).join("");
}
function setCat(c){cat=c;list=c==="Tất cả"?WORDS:WORDS.filter(x=>x.c===c);idx=0;custom=null;renderCats();renderWord()}

/* ---------- Giọng mẫu ---------- */
let deVoice=null;
function pickVoice(){const v=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith("de"));
  deVoice=v.find(v=>/google|anna|helena|katja|petra|neural|enhanced|premium/i.test(v.name))||v[0]||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text,slow){
  if(!("speechSynthesis" in window)){$("err").textContent="Trình duyệt không có giọng đọc.";return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="de-DE";if(deVoice)u.voice=deVoice;
  u.rate=slow?0.55:+cfg.rate;speechSynthesis.speak(u);
  if(!deVoice)$("err").textContent="Máy chưa có giọng tiếng Đức — vào Cài đặt điện thoại để tải giọng German.";
}

/* ---------- So khớp ---------- */
function align(a,b){ // Levenshtein theo ký tự, trả về mảng đánh dấu đúng/sai cho từng ký tự của a
  const n=a.length,m=b.length,d=Array.from({length:n+1},(_,i)=>{const r=new Array(m+1).fill(0);r[0]=i;return r});
  for(let j=0;j<=m;j++)d[0][j]=j;
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  const ok=new Array(n).fill(false);let i=n,j=m;
  while(i>0&&j>0){if(a[i-1]===b[j-1]&&d[i][j]===d[i-1][j-1]){ok[i-1]=true;i--;j--}
    else if(d[i][j]===d[i-1][j-1]+1){i--;j--}else if(d[i][j]===d[i-1][j]+1)i--;else j--}
  return {dist:d[n][m],ok};
}
function score(target,heard){const a=norm(target),b=norm(heard);if(!a)return{pct:0,ok:[]};const r=align(a,b);
  const raw=Math.max(0,Math.round(100*(1-r.dist/Math.max(a.length,b.length))));
  return{pct:r.dist===0?100:Math.min(raw,84),ok:r.ok,a}} // chỉ khớp hoàn toàn mới được "Chuẩn"
function highlight(heard){ // tô màu từng chữ trên thẻ: xanh = khớp, đỏ = máy nghe khác
  const t=cur().w,a=cur().a;let h=norm(heard);if(a)h=h.replace(new RegExp("^"+a+" "),"");
  const tn=norm(t),ok=align(tn,h).ok;let k=0,html="";
  for(const ch of t){const c=norm(ch);
    if(!c){html+=ch;continue}
    if(c===" "){html+=" ";k++;continue}
    const good=[...c].every((_,q)=>ok[k+q]);k+=c.length;html+=`<span class="${good?"ok":"bad"}">${ch}</span>`}
  $("de").innerHTML=html;
}
function show(pct,heard,alts){
  const x=cur(),good=pct>=85,mid=pct>=60;
  $("verdict").textContent=good?"✅ Chuẩn rồi!":mid?"🙂 Gần đúng":"❌ Chưa chuẩn";
  $("verdict").style.color=good?"var(--green)":mid?"var(--orange)":"var(--red)";
  $("heard").innerHTML=heard?`Máy nghe thành: <b>${heard}</b>`:"Máy không nghe ra từ nào";
  $("bar").style.width=pct+"%";$("bar").style.background=good?"var(--green)":mid?"var(--orange)":"var(--red)";
  $("alts").textContent=alts&&alts.length>1?"Các khả năng khác: "+alts.slice(1).join(" · "):"";
  $("result").classList.remove("hidden");
  if(!custom){prog[x.w]=Math.max(prog[x.w]||0,pct);store.set("deProg",prog)}
  $("result").scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* ---------- Chế độ miễn phí: Web Speech API ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const IOS_STANDALONE=navigator.standalone===true;
function listenFree(retry){
  if(!SR){$("err").textContent="Trình duyệt này không hỗ trợ nhận diện giọng nói. Dùng Chrome (Android) hoặc Safari (iPhone).";return}
  const r=new SR();r.lang="de-DE";r.interimResults=true;r.maxAlternatives=5;r.continuous=false;
  let got=null,aborted=false;if(!retry)start();
  r.onresult=e=>{const res=e.results[0];$("status").textContent="… "+res[0].transcript;
    if(res.isFinal)got=[...res].map(a=>({t:a.transcript.trim(),c:a.confidence||0}))};
  r.onerror=e=>{if(e.error==="aborted"){aborted=true;return}$("err").textContent={"not-allowed":"Chưa cho phép micro. Bấm biểu tượng ổ khoá trên thanh địa chỉ → cho phép Micro.","no-speech":"Không nghe thấy gì, thử nói to và gần hơn.","network":"Cần có mạng để nhận diện.","service-not-allowed":"iPhone: bật Đọc chính tả (Cài đặt → Chung → Bàn phím → Bật Đọc chính tả)."}[e.error]||("Lỗi: "+e.error)};
  r.onend=()=>{
    if(aborted&&!got){
      if(!retry){setTimeout(()=>listenFree(true),400);return}
      stop();$("err").textContent=IOS_STANDALONE?"iPhone không cho nhận diện miễn phí khi mở app từ màn hình chính. Hãy mở link trong Safari, hoặc nhập khóa Azure trong ⚙ để dùng chế độ Azure.":"Máy đã ngắt nhận diện. Thử lại; nếu vẫn lỗi, mở trong Safari/Chrome hoặc dùng chế độ Azure (⚙).";return}
    stop();if(!got)return;
    // Chấm nghiêm: CHỈ dùng kết quả đầu tiên của máy (không lấy các phương án dự phòng)
    // và yêu cầu độ chắc chắn của máy đạt ngưỡng theo mức khó.
    const top=got[0],thr=+cfg.level||0.9,target=full(cur());
    const s=[target,cur().w].map(t=>score(t,top.t)).sort((x,y)=>y.pct-x.pct)[0];
    const exact=s.pct===100,hasConf=top.c>0,conf=Math.round(top.c*100);
    let pct=s.pct,note="";
    if(exact&&hasConf&&top.c<thr){pct=Math.min(84,conf);note=`Máy nghe ra đúng từ nhưng chỉ chắc chắn ${conf}% (cần ≥ ${Math.round(thr*100)}%). Đọc rõ hơn, nhất là các âm khó.`}
    else if(exact&&hasConf){pct=Math.max(85,conf);note=`Độ chắc chắn của máy: ${conf}%.`}
    else if(exact){note="Máy không cho biết độ chắc chắn, nên kết quả chỉ mang tính tham khảo."}
    else note=`Chữ <span style="color:var(--red)">đỏ</span> trên thẻ là chỗ máy nghe khác đi. Nghe mẫu chậm rồi thử lại.`;
    // Nếu các phương án dự phòng của máy là những từ khác hẳn → máy đang phân vân
    const others=got.slice(1).map(g=>g.t).filter(t=>![top.t,target,cur().w].some(v=>norm(v)===norm(t)));
    if(exact&&pct>=85&&others.length>=2&&thr>=0.9){pct=84;note+=" Máy còn phân vân với: "+others.slice(0,3).join(", ")+"."}
    highlight(top.t);
    $("scores").classList.add("hidden");$("detail").innerHTML=`<p class="small">${note}</p>`;
    show(pct,top.t,null);
    $("alts").textContent=others.length?"Máy cũng đoán: "+others.join(" · "):"";
  };
  try{r.start()}catch(e){stop();$("err").textContent="Không mở được micro: "+e.message}
}

/* ---------- Chế độ chi tiết: Azure Pronunciation Assessment ---------- */
let sdkP=null;
function loadSdk(){return sdkP||(sdkP=new Promise((ok,no)=>{const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.41.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js";
  s.onload=()=>ok(window.SpeechSDK);s.onerror=()=>{sdkP=null;no(new Error("Không tải được Azure SDK"))};document.head.appendChild(s)}))}
async function listenAzure(){
  start();let S;
  try{S=await loadSdk()}catch(e){stop();$("err").textContent=e.message;return}
  const sc=S.SpeechConfig.fromSubscription(cfg.key,cfg.reg);sc.speechRecognitionLanguage="de-DE";
  const rec=new S.SpeechRecognizer(sc,S.AudioConfig.fromDefaultMicrophoneInput());
  const target=full(cur());
  const pa=new S.PronunciationAssessmentConfig(target,S.PronunciationAssessmentGradingSystem.HundredMark,S.PronunciationAssessmentGranularity.Phoneme,true);
  pa.applyTo(rec);
  rec.recognizeOnceAsync(res=>{stop();rec.close();
    if(res.reason!==S.ResultReason.RecognizedSpeech){$("err").textContent=res.reason===S.ResultReason.NoMatch?"Không nghe rõ, thử lại.":"Lỗi Azure: "+(res.errorDetails||res.reason);return}
    const j=JSON.parse(res.properties.getProperty(S.PropertyId.SpeechServiceResponse_JsonResult));const nb=j.NBest[0],p=nb.PronunciationAssessment||{};
    const cls=v=>v>=80?"g":v>=60?"o":"r";
    $("scores").innerHTML=[["Tổng",p.PronScore],["Chính xác",p.AccuracyScore],["Trôi chảy",p.FluencyScore],["Đầy đủ",p.CompletenessScore]]
      .map(([n,v])=>`<div class="sc"><b>${v==null?"–":Math.round(v)}</b><span>${n}</span></div>`).join("");
    $("scores").classList.remove("hidden");
    const err={Mispronunciation:"đọc sai",Omission:"bị bỏ sót",Insertion:"đọc thừa"};
    $("detail").innerHTML=(nb.Words||[]).map(w=>{const a=w.PronunciationAssessment||{};
      return `<div class="wd"><span class="w">${w.Word}</span> · ${Math.round(a.AccuracyScore??0)} ${a.ErrorType&&a.ErrorType!=="None"?`<span style="color:var(--red)">(${err[a.ErrorType]||a.ErrorType})</span>`:""}<br>${
        (w.Phonemes||[]).map(ph=>{const v=ph.PronunciationAssessment?.AccuracyScore??0;return `<span class="ph ${cls(v)}">${ph.Phoneme} ${Math.round(v)}</span>`}).join("")}</div>`}).join("");
    $("de").textContent=cur().w;
    show(Math.round(p.PronScore??p.AccuracyScore??0),res.text,null);
  },e=>{stop();rec.close();$("err").textContent="Lỗi Azure: "+e});
}

function start(){busy=true;$("mic").classList.add("on");$("status").textContent="Đang nghe… hãy đọc";$("err").textContent="";$("result").classList.add("hidden");$("de").textContent=cur().w;try{if(window.speechSynthesis&&speechSynthesis.speaking)speechSynthesis.cancel()}catch(e){}}
function stop(){busy=false;$("mic").classList.remove("on");$("status").textContent="Bấm mic để đọc lại"}
function useAzure(){return cfg.key&&cfg.reg}
function modeInfo(){$("modeInfo").textContent="Đang dùng: "+(useAzure()?"Azure – chấm từng âm":"nhận diện miễn phí của trình duyệt")}

/* ---------- Sự kiện ---------- */
$("cats").onclick=e=>{const b=e.target.closest("[data-c]");if(b)setCat(b.dataset.c)};
$("prev").onclick=()=>{custom=null;idx=(idx-1+list.length)%list.length;renderWord()};
$("next").onclick=$("goNext").onclick=()=>{custom=null;idx=(idx+1)%list.length;renderWord()};
$("again").onclick=()=>$("mic").click();
$("listen").onclick=()=>speak(full(cur()),false);
$("listenSlow").onclick=()=>speak(full(cur()),true);
$("mic").onclick=()=>{if(busy)return;useAzure()?listenAzure():listenFree()};
$("btnSet").onclick=()=>{$("setPanel").classList.toggle("hidden");$("listPanel").classList.add("hidden")};
$("btnList").onclick=()=>{renderList();$("listPanel").classList.toggle("hidden");$("setPanel").classList.add("hidden")};
$("list").onclick=e=>{const b=e.target.closest("[data-i]");if(!b)return;cat="Tất cả";list=WORDS;idx=+b.dataset.i;custom=null;renderCats();renderWord();$("listPanel").classList.add("hidden")};
$("saveSet").onclick=()=>{cfg={rate:$("rate").value,level:$("level").value,key:$("azKey").value.trim(),reg:$("azReg").value.trim()};store.set("deCfg",cfg);modeInfo();$("setPanel").classList.add("hidden")};
$("resetProg").onclick=()=>{prog={};store.set("deProg",prog);renderList();renderWord()};
$("useCustom").onclick=()=>{const v=$("custom").value.trim();if(!v)return;custom={a:"",w:v,m:"",t:""};renderWord();window.scrollTo({top:0,behavior:"smooth"})};
$("custom").onkeydown=e=>{if(e.key==="Enter")$("useCustom").click()};

$("rate").value=cfg.rate;$("level").value=cfg.level||"0.9";$("azKey").value=cfg.key||"";$("azReg").value=cfg.reg||"";modeInfo();
renderCats();renderWord();
if(!window.isSecureContext)$("err").textContent="Cần mở qua link https:// thì micro mới hoạt động.";
}
</script>
